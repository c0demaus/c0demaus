<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Code Prompt Wizard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="qa-container">
            <div id="question"></div>
            <ul id="answers"></ul>
        </div>
        <div id="prompt-container" style="display: none;">
            <h2>Your Vibe Code Prompt:</h2>
            <textarea id="prompt" readonly></textarea>
            <button id="copy-button">Copy Prompt</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
